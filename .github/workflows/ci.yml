name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mailbox-copies:
    name: index.html matches Letter-Llama.html
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compare the two mailbox files
        run: |
          if ! cmp -s index.html Letter-Llama.html; then
            echo "::error::index.html and Letter-Llama.html are different. Copy Letter-Llama.html over index.html and commit both."
            exit 1
          fi
          echo "The two mailbox files match."

  no-secrets:
    name: No .env or Google client secret
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fail on committed .env files
        run: |
          found=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v -E '\.env\.example$' || true)
          if [ -n "$found" ]; then
            echo "::error::These .env files are committed and must be removed: $found"
            exit 1
          fi
          echo "No .env files are committed."
      - name: Fail on Google client secrets
        run: |
          if git grep -nI -E 'GOCSPX-[A-Za-z0-9_-]{10,}|"client_secret"[[:space:]]*:[[:space:]]*"[^"]+"'; then
            echo "::error::A Google OAuth client secret is committed. Remove it and rotate it in Google Cloud."
            exit 1
          fi
          echo "No Google client secret found."

  phase1-tests:
    name: phase1 Rust tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: phase1
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: phase1
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked -- -D warnings
      - name: Run tests
        run: cargo test --locked

  gitleaks:
    name: gitleaks secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          rm "$tarball"
      - name: Scan full git history
        run: ./gitleaks git --redact --verbose .
