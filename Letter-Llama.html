  <style>
    :root {
      --ink: #07111f;
      --paper: #f4efe4;
      --cobalt: #2f7de1;
      --brass: #c6a15a;
      --line: #24344c;
      --surface: #101b2e;
      --muted: rgba(244, 239, 228, 0.7);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--ink); color: var(--paper); font-family: Outfit, system-ui, sans-serif; }
    button, select, input, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: default; }
    h1, h2, .display { font-family: Fraunces, Georgia, serif; font-weight: 560; }
    .shell { min-height: 100dvh; }
    .side { display: none; }
    header.bar { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    header.bar img, .brand img { width: 44px; height: 44px; border-radius: 12px; object-fit: cover; box-shadow: 0 0 0 1px rgba(198,161,90,.7); }
    .brand img { width: 56px; height: 56px; border-radius: 16px; }
    main { padding: 24px 16px 112px; max-width: 760px; }
    .tabs { position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(4, 1fr); background: rgba(7,17,31,.95); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
    .tabs button, .side nav button { background: none; border: 0; color: rgba(244,239,228,.65); min-height: 56px; }
    .tabs button.on, .side nav button.on { color: var(--cobalt); }
    .side nav button.on { background: var(--surface); color: var(--paper); }
    h1 { font-size: 2.4rem; margin: 8px 0; line-height: 1.1; }
    p.lead { color: var(--muted); line-height: 1.5; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .chip, .btn, .ghost, .danger, .brass { min-height: 48px; border-radius: 12px; padding: 0 16px; }
    .chip { border: 1px solid var(--line); background: transparent; }
    .chip.on { background: var(--cobalt); border-color: var(--cobalt); }
    .btn { background: var(--cobalt); border: 0; }
    .ghost { background: transparent; border: 1px solid var(--line); }
    .danger { background: transparent; border: 1px solid rgba(47,125,225,.5); color: var(--cobalt); }
    .brass { background: transparent; border: 1px solid rgba(198,161,90,.7); color: var(--brass); }
    .solid-brass { background: var(--brass); color: var(--ink); border: 0; min-height: 48px; border-radius: 12px; width: 100%; }
    input, textarea, select { width: 100%; background: var(--ink); border: 1px solid var(--line); border-radius: 12px; min-height: 48px; padding: 10px 12px; }
    textarea { min-height: 120px; }
    label { display: block; color: rgba(244,239,228,.6); font-size: .9rem; margin-top: 10px; }
    .card, .letter { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-top: 8px; }
    .letter { display: block; }
    .meta { display: flex; justify-content: space-between; color: rgba(244,239,228,.6); font-size: .9rem; }
    .subject { font-family: Fraunces, Georgia, serif; font-size: 1.45rem; margin-top: 4px; }
    .dot { width: 8px; height: 8px; border-radius: 99px; background: var(--cobalt); display: inline-block; margin-right: 8px; }
    .warn { border: 1px solid rgba(198,161,90,.7); border-radius: 16px; padding: 14px; margin-top: 12px; color: var(--brass); }
    .stack { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    @media (min-width: 800px) {
      .shell { display: grid; grid-template-columns: 260px 1fr; }
      .side { display: flex; flex-direction: column; border-right: 1px solid var(--line); padding: 24px 16px; min-height: 100dvh; }
      .side nav { display: flex; flex-direction: column; gap: 4px; margin-top: 28px; }
      .side nav button { text-align: left; border-radius: 12px; padding: 0 12px; min-height: 44px; }
      .side .foot { margin-top: auto; color: rgba(244,239,228,.6); font-size: .95rem; line-height: 1.45; }
      header.bar, .tabs { display: none; }
      main { padding: 32px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="brand" style="display:flex;gap:12px;align-items:center">
        <img id="mark-side" alt="" />
        <div>
          <div class="display" style="font-size:1.6rem;line-height:1">Letter Llama</div>
          <div style="color:var(--brass);font-size:.9rem;margin-top:4px">On this device</div>
        </div>
      </div>
      <nav id="side-nav"></nav>
      <p class="foot">Your mailbox is in this file. Letters stay on this computer.</p>
    </aside>
    <div>
      <header class="bar">
        <img id="mark-top" alt="" />
        <div>
          <div class="display" style="font-size:1.3rem;line-height:1">Letter Llama</div>
          <div style="color:var(--brass);font-size:.9rem;margin-top:4px">On this device</div>
        </div>
      </header>
      <main id="main"></main>
    </div>
  </div>

    document.getElementById("mark-side").src = MARK;
    document.getElementById("mark-top").src = MARK;
    const KEY = "letter-llama-mailbox-v1";
    const folders = [
      ["inbox", "Inbox"],
      ["sent", "Sent"],
      ["archived", "Set aside"],
      ["trash", "Trash"]
    ];
    const views = [
      ["mail", "Desk"],
      ["piles", "Piles"],
      ["cleanup", "Cleanup"],
      ["rules", "Rules"]
    ];
    const kinds = [
      ["keep", "Keep"],
      ["archive", "Set aside"],
      ["trash", "Trash"],
      ["permanent_delete", "Permanent delete"]
    ];
    const seed = [
      ["Northline Post", "You", "Buckle shipment is at the window", "The brass buckles for the cream satchels arrived this morning. They are behind the counter under your name.", "Oct 8", true],
      ["Hearth Library", "You", "Your hold is on the desk", "A book you asked for is waiting at the front desk until Friday. Ask for the green slip.", "Oct 7", true],
      ["Satchel & Stitch", "You", "Repair ticket 184", "The left strap is restitched and the buckle hole is recut. The ticket is paid. Pick it up when you are next in.", "Oct 4", false],
      ["Weekly Fold", "You", "Three routes, one map", "This week's fold covers the river road, the ridge cut, and the closed bridge. The bridge stays shut through Sunday.", "Oct 2", true],
      ["Cobalt Paper Co.", "You", "Invoice for cream stock", "Forty sheets of cream stock, paid. Keep the invoice with the shop papers.", "Sep 28", false],
      ["Night Window", "You", "Old notes, unread since spring", "A stack of old notes has been sitting since spring. Say if you want them boxed or thrown out.", "Sep 12", true]
    ].map((row, i) => ({ id: "seed-" + i, from: row[0], to: row[1], subject: row[2], body: row[3], when: row[4], unread: row[5], place: "inbox", pileIds: [] }));

    let state = load();
    function load() {
      try {
        const saved = JSON.parse(localStorage.getItem(KEY) || "null");
        if (saved && Array.isArray(saved.letters)) return Object.assign(blank(), saved);
      } catch (e) {}
      return blank();
    }
    function blank() {
      return { view: "mail", folder: "inbox", letters: seed, piles: [], rules: [], openId: null, writing: false, to: "", subject: "", body: "", replying: false, reply: "", armed: false, query: "", selected: [], bin: "active", armedRule: null, pileName: "", ruleName: "", ruleQuery: "", ruleKind: "archive" };
    }
    function save() { localStorage.setItem(KEY, JSON.stringify(state)); }
    function uid() { return Math.random().toString(36).slice(2) + Date.now().toString(36); }
    function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => "&#" + c.charCodeAt(0) + ";"); }
    function set(patch) { state = Object.assign({}, state, patch); save(); draw(); }
    function label(list, id) { return (list.find((item) => item[0] === id) || ["", id])[1]; }

    function send(to, subject, body) {
      const when = "Oct 10";
      const sent = { id: uid(), from: "You", to, subject, body, when, unread: false, place: "sent", pileIds: [] };
      const delivered = Object.assign({}, sent, { id: uid(), unread: true, place: "inbox" });
      set({ letters: [delivered, sent].concat(state.letters), writing: false, replying: false, to: "", subject: "", body: "", reply: "", openId: null, folder: "sent", view: "mail" });
    }

    function draw() {
      document.getElementById("side-nav").innerHTML = views.map(([id, name]) => `<button data-view="${id}" class="${state.view === id ? "on" : ""}">${name}</button>`).join("");
      document.getElementById("tabs").innerHTML = views.map(([id, name]) => `<button data-view="${id}" class="${state.view === id ? "on" : ""}">${name}</button>`).join("");
      const main = document.getElementById("main");
      if (state.view === "piles") main.innerHTML = pilesView();
      else if (state.view === "cleanup") main.innerHTML = cleanupView();
      else if (state.view === "rules") main.innerHTML = rulesView();
      else main.innerHTML = mailView();
    }

    function mailView() {
      if (state.openId) {
        const letter = state.letters.find((item) => item.id === state.openId);
        if (letter) return reader(letter);
      }
      const q = state.query.trim().toLowerCase();
      const shown = state.letters.filter((letter) => letter.place === state.folder && (!q || `${letter.from} ${letter.to} ${letter.subject} ${letter.body}`.toLowerCase().includes(q)));
      const form = state.writing ? `
        <form id="compose">
          <label for="to">To</label><input id="to" name="to" value="${esc(state.to)}" placeholder="Name" />
          <label for="subject">Subject</label><input id="subject" name="subject" value="${esc(state.subject)}" />
          <label for="body">Letter</label><textarea id="body" name="body">${esc(state.body)}</textarea>
          <div class="row"><button class="btn" type="submit">Send</button><button class="ghost" type="button" data-act="cancel-write">Cancel</button></div>
        </form>` : `<button class="btn" data-act="write" style="margin-top:16px">New letter</button>`;
      return `
        <h1>${esc(label(folders, state.folder))}</h1>
        <p class="lead">This mailbox is Letter Llama. A sent letter shows up in Sent and in the inbox.</p>
        ${form}
        <label for="q">Search</label>
        <input id="q" value="${esc(state.query)}" placeholder="Search mail" />
        <div class="row">${folders.map(([id, name]) => `<button class="chip ${state.folder === id ? "on" : ""}" data-folder="${id}">${name}</button>`).join("")}</div>
        ${shown.length ? shown.map((letter) => `
          <button class="letter" data-open="${letter.id}">
            <span class="meta"><span>${letter.unread ? '<i class="dot"></i>' : ""}${esc(letter.place === "sent" ? "To " + letter.to : letter.from)}</span><span>${esc(letter.when)}</span></span>
            <span class="subject">${esc(letter.subject)}</span>
          </button>`).join("") : `<p class="lead">Nothing in ${esc(label(folders, state.folder).toLowerCase())}.</p>`}
      `;
    }

    function reader(letter) {
      const piles = state.piles.filter((pile) => letter.pileIds.includes(pile.id));
      const reply = state.replying ? `
        <form id="reply">
          <label for="reply-body">Reply to ${esc(letter.from)}</label>
          <textarea id="reply-body" name="reply">${esc(state.reply)}</textarea>
          <div class="row"><button class="btn" type="submit">Send reply</button><button class="ghost" type="button" data-act="cancel-reply">Cancel</button></div>
        </form>` : `<button class="btn" data-act="reply" style="margin-top:16px">Reply</button>`;
      const file = letter.place === "trash"
        ? `<button class="btn" data-act="restore">Put back in the inbox</button>`
        : `<button class="ghost" data-act="archive">${letter.place === "archived" ? "Return to inbox" : "Set aside"}</button><button class="danger" data-act="trash">Move to trash</button>`;
      const kill = state.armed
        ? `<div class="warn"><p>This removes the letter from this mailbox. It cannot be undone.</p><button class="solid-brass" data-act="confirm-delete">Yes, delete this letter</button></div>`
        : `<button class="brass" data-act="arm" style="margin-top:12px">Delete forever</button>`;
      const pileSelect = state.piles.length ? `<label for="pile">Piles</label><select id="pile"><option value="">Add or remove a pile</option>${state.piles.map((pile) => `<option value="${esc(pile.id)}">${letter.pileIds.includes(pile.id) ? "Remove from " : ""}${esc(pile.name)}</option>`).join("")}</select>` : `<p class="lead">Make a pile first.</p>`;
      return `
        <button class="ghost" data-act="back">Back</button>
        <p class="lead">From ${esc(letter.from)} · To ${esc(letter.to || "You")} · ${esc(letter.when)}</p>
        <h1>${esc(letter.subject)}</h1>
        <p class="lead" style="font-size:1.15rem;color:rgba(244,239,228,.85)">${esc(letter.body)}</p>
        ${reply}
        <div class="row">${file}</div>
        <p class="lead">Trash can be undone. Delete forever cannot.</p>
        ${kill}
        <div style="margin-top:18px">${pileSelect}</div>
        <div class="row">${piles.map((pile) => `<button class="brass" data-pile="${esc(pile.id)}">${esc(pile.name)} · remove</button>`).join("")}</div>
      `;
    }

    function pilesView() {
      return `
        <h1>Piles</h1>
        <p class="lead">A pile is a list in Letter Llama. Removing a pile does not delete the letters.</p>
        <form id="add-pile" class="row">
          <input name="name" placeholder="Receipts, keep, later" value="${esc(state.pileName)}" style="flex:1" />
          <button class="btn" type="submit">Add pile</button>
        </form>
        ${state.piles.map((pile) => {
          const members = state.letters.filter((letter) => letter.pileIds.includes(pile.id));
          return `<div class="card"><div class="row"><input data-rename="${esc(pile.id)}" value="${esc(pile.name)}" /><button class="ghost" data-remove-pile="${esc(pile.id)}">Remove pile</button></div>${members.length ? members.map((letter) => `<div class="lead">${esc(letter.subject)}</div>`).join("") : `<p class="lead">No letters in this pile.</p>`}</div>`;
        }).join("") || `<p class="lead">No piles yet.</p>`}
      `;
    }

    function cleanupView() {
      const pool = state.letters.filter((letter) => state.bin === "trash" ? letter.place === "trash" : letter.place !== "trash" && letter.place !== "sent");
      return `
        <h1>Cleanup</h1>
        <p class="lead">Trash can be undone. Delete forever asks a second time and does not trash the letter instead.</p>
        <div class="row">
          <button class="chip ${state.bin === "active" ? "on" : ""}" data-bin="active">Still here</button>
          <button class="chip ${state.bin === "trash" ? "on" : ""}" data-bin="trash">Trash</button>
        </div>
        ${pool.map((letter) => `<label class="card" style="display:flex;gap:12px;align-items:flex-start"><input type="checkbox" data-check="${esc(letter.id)}" ${state.selected.includes(letter.id) ? "checked" : ""} /><span><span class="lead">${esc(letter.from)}</span><span class="subject">${esc(letter.subject)}</span></span></label>`).join("") || `<p class="lead">Nothing in this tray.</p>`}
        <div class="row">
          ${state.bin === "trash" ? `<button class="danger" data-act="put-back" ${state.selected.length ? "" : "disabled"}>Put back</button>` : `<button class="danger" data-act="trash-selected" ${state.selected.length ? "" : "disabled"}>Move to trash</button>`}
          <button class="brass" data-act="arm-many" ${state.selected.length ? "" : "disabled"}>Delete forever</button>
        </div>
        ${state.armed ? `<div class="warn"><p>This removes the selected letters. It cannot be undone, and it does not move them to trash.</p><button class="solid-brass" data-act="confirm-many">Yes, delete these letters</button></div>` : ""}
      `;
    }

    function hits(rule) {
      const words = rule.query.toLowerCase().split(/\s+/).filter(Boolean);
      if (!words.length) return [];
      return state.letters.filter((letter) => words.every((word) => `${letter.from} ${letter.to} ${letter.subject} ${letter.body}`.toLowerCase().includes(word)));
    }

    function rulesView() {
      return `
        <h1>Rules</h1>
        <p class="lead">A rule sorts mail in this mailbox. Delete forever still asks twice.</p>
        <form id="add-rule">
          <label for="rule-name">Name</label><input id="rule-name" name="name" value="${esc(state.ruleName)}" />
          <label for="rule-query">Words to match</label><input id="rule-query" name="query" value="${esc(state.ruleQuery)}" placeholder="invoice, newsletter, spring" />
          <label for="rule-kind">Action</label>
          <select id="rule-kind" name="kind">${kinds.map(([id, name]) => `<option value="${id}" ${state.ruleKind === id ? "selected" : ""}>${name}</option>`).join("")}</select>
          <button class="btn" style="margin-top:12px" type="submit">Save rule</button>
        </form>
        ${state.rules.map((rule) => {
          const matched = hits(rule);
          const action = rule.kind === "permanent_delete"
            ? (state.armedRule === rule.id
              ? `<button class="solid-brass" data-run="${esc(rule.id)}">Yes, delete these letters</button>`
              : `<button class="brass" data-arm-rule="${esc(rule.id)}" ${matched.length ? "" : "disabled"}>Delete matches forever</button>`)
            : `<button class="danger" data-run="${esc(rule.id)}" ${matched.length ? "" : "disabled"}>${rule.kind === "trash" ? "Move matches to trash" : rule.kind === "archive" ? "Set matches aside" : "Keep matches in the inbox"}</button>`;
          return `<div class="card"><div class="row" style="justify-content:space-between"><div><strong>${esc(rule.name)}</strong><div class="lead">${esc(label(kinds, rule.kind))}${rule.query ? " · " + esc(rule.query) : ""}</div><div class="lead">${matched.length ? matched.length + " match: " + esc(matched.map((letter) => letter.subject).join(", ")) : "No letters match."}</div></div><button class="ghost" data-remove-rule="${esc(rule.id)}">Remove</button></div>${action}</div>`;
        }).join("")}
      `;
    }

    document.body.addEventListener("click", (event) => {
      const t = event.target.closest("button, [data-pile]");
      if (!t) return;
      if (t.dataset.view) return set({ view: t.dataset.view, openId: null, writing: false, armed: false });
      if (t.dataset.folder) return set({ folder: t.dataset.folder, openId: null });
      if (t.dataset.open) {
        state.letters = state.letters.map((letter) => letter.id === t.dataset.open ? Object.assign({}, letter, { unread: false }) : letter);
        return set({ openId: t.dataset.open, armed: false, replying: false });
      }
      if (t.dataset.act === "write") return set({ writing: true });
      if (t.dataset.act === "cancel-write") return set({ writing: false });
      if (t.dataset.act === "back") return set({ openId: null, armed: false, replying: false });
      if (t.dataset.act === "reply") return set({ replying: true });
      if (t.dataset.act === "cancel-reply") return set({ replying: false });
      const letter = state.letters.find((item) => item.id === state.openId);
      if (t.dataset.act === "trash" && letter) return move([letter.id], "trash");
      if (t.dataset.act === "archive" && letter) return move([letter.id], letter.place === "archived" ? "inbox" : "archived");
      if (t.dataset.act === "restore" && letter) return move([letter.id], "inbox");
      if (t.dataset.act === "arm") return set({ armed: true });
      if (t.dataset.act === "confirm-delete" && letter) {
        state.letters = state.letters.filter((item) => item.id !== letter.id);
        return set({ openId: null, armed: false });
      }
      if (t.dataset.pile && letter) return togglePile(letter.id, t.dataset.pile);
      if (t.dataset.removePile) {
        state.piles = state.piles.filter((pile) => pile.id !== t.dataset.removePile);
        state.letters = state.letters.map((item) => Object.assign({}, item, { pileIds: item.pileIds.filter((id) => id !== t.dataset.removePile) }));
        return set({});
      }
      if (t.dataset.bin) return set({ bin: t.dataset.bin, selected: [], armed: false });
      if (t.dataset.act === "trash-selected") return move(state.selected, "trash", { selected: [], armed: false });
      if (t.dataset.act === "put-back") return move(state.selected, "inbox", { selected: [], armed: false });
      if (t.dataset.act === "arm-many") return set({ armed: true });
      if (t.dataset.act === "confirm-many") {
        const drop = new Set(state.selected);
        state.letters = state.letters.filter((item) => !drop.has(item.id));
        return set({ selected: [], armed: false });
      }
      if (t.dataset.removeRule) return set({ rules: state.rules.filter((rule) => rule.id !== t.dataset.removeRule) });
      if (t.dataset.armRule) return set({ armedRule: t.dataset.armRule });
      if (t.dataset.run) return runRule(t.dataset.run);
    });

    document.body.addEventListener("submit", (event) => {
      const form = event.target;
      if (!(form instanceof HTMLFormElement)) return;
      event.preventDefault();
      const data = new FormData(form);
      if (form.id === "compose") {
        const to = String(data.get("to") || "").trim();
        const subject = String(data.get("subject") || "").trim();
        const body = String(data.get("body") || "").trim();
        if (to && subject && body) send(to, subject, body);
        return;
      }
      if (form.id === "reply") {
        const letter = state.letters.find((item) => item.id === state.openId);
        const body = String(data.get("reply") || "").trim();
        if (letter && body) send(letter.from, letter.subject.startsWith("Re:") ? letter.subject : "Re: " + letter.subject, body);
        return;
      }
      if (form.id === "add-pile") {
        const name = String(data.get("name") || "").trim();
        if (!name) return;
        state.piles = state.piles.concat([{ id: uid(), name }]);
        return set({ pileName: "" });
      }
      if (form.id === "add-rule") {
        const name = String(data.get("name") || "").trim();
        if (!name) return;
        state.rules = state.rules.concat([{ id: uid(), name, query: String(data.get("query") || "").trim(), kind: String(data.get("kind") || "archive") }]);
        return set({ ruleName: "", ruleQuery: "", ruleKind: "archive" });
      }
    });

    document.body.addEventListener("change", (event) => {
      const t = event.target;
      if (t.id === "q") return set({ query: t.value });
      if (t.id === "pile") {
        const letter = state.letters.find((item) => item.id === state.openId);
        if (letter && t.value) togglePile(letter.id, t.value);
        return;
      }
      if (t.dataset && t.dataset.check) {
        const id = t.dataset.check;
        const selected = state.selected.includes(id) ? state.selected.filter((item) => item !== id) : state.selected.concat([id]);
        return set({ selected, armed: false });
      }
      if (t.dataset && t.dataset.rename) {
        const name = t.value.trim();
        if (!name) return draw();
        state.piles = state.piles.map((pile) => pile.id === t.dataset.rename ? Object.assign({}, pile, { name }) : pile);
        return set({});
      }
    });

    function move(ids, place, extra) {
      const wanted = new Set(ids);
      state.letters = state.letters.map((letter) => wanted.has(letter.id) ? Object.assign({}, letter, { place }) : letter);
      set(Object.assign({ armed: false }, extra || {}));
    }
    function togglePile(letterId, pileId) {
      state.letters = state.letters.map((letter) => {
        if (letter.id !== letterId) return letter;
        const has = letter.pileIds.includes(pileId);
        return Object.assign({}, letter, { pileIds: has ? letter.pileIds.filter((id) => id !== pileId) : letter.pileIds.concat([pileId]) });
      });
      set({});
    }
    function runRule(id) {
      const rule = state.rules.find((item) => item.id === id);
      if (!rule) return;
      const ids = hits(rule).map((letter) => letter.id);
      if (rule.kind === "permanent_delete") {
        if (state.armedRule !== id) return set({ armedRule: id });
        const drop = new Set(ids);
        state.letters = state.letters.filter((letter) => !drop.has(letter.id));
        return set({ armedRule: null });
      }
      const place = rule.kind === "trash" ? "trash" : rule.kind === "archive" ? "archived" : "inbox";
      move(ids, place, { armedRule: null });
    }

    draw();
  </script>
</body>
</html>
