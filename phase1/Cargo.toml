[package]
name = "letter-llama"
version = "0.1.0"
edition = "2021"
description = "Letter Llama Phase 1 Gmail proof. No full mailbox copy."
publish = false

[[bin]]
name = "letter-llama"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
getrandom = "0.2"
keyring = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"
